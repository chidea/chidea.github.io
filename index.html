<!doctype html>

    <head>
        <meta charset="utf-8" />
        <title>Creole Live Editor with WASM</title>
        <link rel="manifest" href="/manifest.json">
        
<script type="module">
import init, * as bindings from '/wasm-creole-live-editor-a00ac92963007ff1.js';
const wasm = await init({ module_or_path: '/wasm-creole-live-editor-d807d56f4a13dc3a_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
        <!-- Trunk copies nothing out of static/ by itself; these hooks are what put the PWA
             assets beside index.html in dist/ (and therefore into bu.ps1's copy to the Pages
             checkout). static/index.html is a dead Yew-era page and is deliberately not
             copied: it would overwrite the generated index.html. -->
        
        
        
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="application-name" content="WCLE">
        <meta name="apple-mobile-web-app-title" content="WCLE">
        <meta name="theme-color" content="#654FF0">
        <meta name="msapplication-navbutton-color" content="#FF9800">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="msapplication-starturl" content="/index.html">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <script>
            // The offline app shell; static/service-worker.js explains the caching policy.
            // Registered from the site root so its scope covers every route (/w/, /e/, /list).
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker
                        .register('/service-worker.js', { scope: '/' })
                        .catch((e) => console.warn('service worker:', e));
                });
            }
        </script>
        <style>
          figure {
            display: inline-block;
          }
          .wrapper {
            display: flex;
          }
          .editor, .preview {
            width: 50%;
            padding: .5rem;
          }
          .editor > textarea {
            width: 100%;
            height: calc(100% - 5rem);
          }
          table {
            border-collapse: collapse;
          }
          thead {
            background: #eee;
          }
          td {
            padding: .25rem;
            border: 1px solid;
            word-break: keep-all;
          }
          pre {
            display: inline;
          }
          div.preview > pre {
            display: block;
          }
          ol, ul {
            padding-inline-start: 1em;
          }
          /* repeated numbering for ordered list */
          ol > li {
              counter-increment: item;
          }
          ol > li:first-child, ol > ol:first-child {
            counter-reset: item;
            counter-increment: item;
          }
          ol ol > li {
              display: block;
          }
          ol ol > li:before {
              content: counters(item, ".") ". ";
              margin-left: -20px;
          }

          img {
            max-width: 100%;
          }

          /* /list tree. Open/close is the native <details> disclosure, so no
             rule here is interactive and no script is involved. */
          ul.tree, ul.tree ul {
            list-style: none;
            padding-inline-start: 1.1em;
          }
          ul.tree {
            padding-inline-start: 0;
          }
          .tree summary {
            cursor: pointer;
          }
          .tree summary > a {
            font-weight: 600;
          }
          .tree .doc {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          p.hint {
            color: #777;
            font-size: .9em;
          }
          @media print {
            nav {
              display: none;
            }
            h2.view-name {
              display: none;
            }
          }
        </style>
